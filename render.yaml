services:
  - type: web
    name: fluency-coach
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    envVars:
      - key: GROQ_API_KEY
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: fluency-db
          property: connectionString

databases:
  - name: fluency-db
    plan: free
